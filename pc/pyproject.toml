[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phonecam"
version = "0.1.0"
description = "Turn an Android phone into a low-latency webcam and microphone for Linux (V4L2 + PipeWire)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
# PySide6 and numpy come from Ubuntu (python3-pyside6.*, python3-numpy) via a
# --system-site-packages venv; see README. They are listed so pip can install them elsewhere.
dependencies = [
    "PySide6>=6.6",
    "numpy>=1.26",
    "av>=12",
    "zeroconf>=0.130",
]

keywords = ["webcam", "android", "v4l2loopback", "pipewire", "h264", "virtual-camera"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video :: Capture",
]

[project.urls]
Homepage = "https://github.com/aresme/phonecam"
Documentation = "https://github.com/aresme/phonecam/tree/main/docs"
Issues = "https://github.com/aresme/phonecam/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
phonecam = "phonecam.__main__:main"

[tool.setuptools.packages.find]
include = ["phonecam*"]

[tool.setuptools.package-data]
phonecam = ["resources/*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
allowed-confusables = ["×"]

[tool.ruff.lint.per-file-ignores]
"tests/test_adb.py" = ["E501"]  # verbatim adb output

[tool.pytest.ini_options]
testpaths = ["tests"]
